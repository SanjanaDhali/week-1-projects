<section class="contact">

<h1>Contact Us</h1>

<p class="section-text">
We'd love to hear from you. Send us a message
or visit our bookstore to explore our collection.
</p>

<img src="images/contact.jpg" height="300" width="400"
alt="Contact Cozy Corner"
class="contact-img">

<form>

<input
type="text"
placeholder="Your Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="tel"
placeholder="Phone Number"
required>

<textarea
rows="6"
placeholder="Your Message"
required></textarea>

<button type="submit" class="btn">
Send Message
</button>

</form>

</section>

<footer>

<div class="footer-content">

<h3>Cozy Corner Bookstore</h3>

<p>
Helping readers discover amazing books.
</p>

<div class="social-icons">
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-x-twitter"></i>
</div>

</div>

<p class="copyright">
© 2026 Cozy Corner Bookstore. All Rights Reserved.
</p>

</footer>
