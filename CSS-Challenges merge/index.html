<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Challenge Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="main-title">CSS Challenge Project</h1>

<!-- 1. FLEXBOX SECTION -->
<section class="section">
  <h2>Flexbox Testimonials</h2>

  <div class="flex-container">

    <div class="card">
      <h3>Sara</h3>
      <p>Great service and smooth experience.</p>
    </div>

    <div class="card">
      <h3>Mike</h3>
      <p>Clean work and fast delivery.</p>
    </div>

    <div class="card">
      <h3>Emma</h3>
      <p>Very professional and reliable.</p>
    </div>

  </div>
</section>

<!-- 2. GRID SECTION -->
<section class="section">
  <h2>Grid Dashboard</h2>

  <div class="grid-container">
    <div class="grid-item">Dashboard</div>
    <div class="grid-item">Users</div>
    <div class="grid-item">Reports</div>
    <div class="grid-item">Analytics</div>
    <div class="grid-item">Messages</div>
    <div class="grid-item">Settings</div>
  </div>
</section>

<!-- 3. ANIMATION SECTION -->
<section class="section">
  <h2>Animation Card</h2>

  <div class="anim-card">
    <h3>Hover Me</h3>
    <p>Watch smooth lift animation ✨</p>
  </div>
</section>

</body>
</html>
